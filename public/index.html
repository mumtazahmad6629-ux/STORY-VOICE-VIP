<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Urdu & English AI Voice Studio</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        textarea, select, button {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        textarea {
            height: 150px;
            resize: vertical;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s ease;
        }
        button:hover {
            background-color: #219653;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Professional Urdu & English AI Voice Studio</h1>
        
        <div class="form-group">
            <label for="text-input">یہاں اپنا متن (Text) درج کریں:</label>
            <textarea id="text-input" placeholder="اردو یا انگریزی میں متن لکھیں..."></textarea>
        </div>

        <div class="form-group">
            <label for="voice-select">آواز کا انتخاب کریں (Voice):</label>
            <select id="voice-select">
                <option value="ur-PK">اردو (Pakistan)</option>
                <option value="en-US">English (United States)</option>
            </select>
        </div>

        <button id="generate-btn">آواز تبدیل کریں (Generate Voice)</button>
    </div>

</body>
</html>
